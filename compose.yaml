name: githubwin10
services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: githubwin10-portainer
    restart: unless-stopped
    command: ["--http-enabled", "--admin-password-file", "/run/portainer-admin-password"]
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./.secrets/portainer-password:/run/portainer-admin-password:ro

  windows:
    image: dockurr/windows:latest
    container_name: githubwin10-windows
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      VERSION: "${WINDOWS_VERSION:-10}"
      CPU_CORES: "${WINDOWS_CPU_CORES:-4}"
      RAM_SIZE: "${WINDOWS_RAM_SIZE:-4G}"
      DISK_SIZE: "${WINDOWS_DISK_SIZE:-32G}"
      DISK_FMT: "qcow2"
      KVM: "N"
      NETWORK: "user"
      USER_PORTS: "3389"
      LANGUAGE: "${WINDOWS_LANGUAGE:-French}"
      USERNAME: "${WINDOWS_USERNAME:-etudiant}"
      PASSWORD: "${WINDOWS_PASSWORD:?Mot de passe Windows absent dans .env}"
      AUTOLOGIN: "N"
      PROTECT: "Y"
      WEB: "Y"
      DISPLAY: "web"
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
    volumes:
      - windows_storage:/storage
volumes:
  portainer_data:
  windows_storage:
